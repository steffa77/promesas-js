<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="formBuscador">
        <input type="text" id="idpokemon" placeholder="Ejemplo: 25">
        <button type="submit">Buscar</button>

        <div>
            <label>Nombre:</label>
            <input type="text" id="nombre">
        </div>
        <div>
            <label>Altura:</label>
            <input type="text" id="altura">
        </div>
        <div>
            <label>Peso:</label>
            <input type="text" id="peso">
        </div>
        <div>
            <label>Imagen:</label>
            <input id="imagen" width="150">
        </div>
    </form>

    <script>
        const formulario = document.getElementById('formBuscador')
        const id = document.getElementById('idpokemon')
        const nombre = document.getElementById('nombre')
        const altura = document.getElementById('altura')
        const peso = document.getElementById('peso')
        const imagen = document.getElementById('imagen')

        formulario.addEventListener("submit", (event)=>{
            event.preventDefault()
            obtenerPokemon(id.value)
        })

        async function obtenerPokemon(id){
            const API_URL = `https://pokeapi.co/api/v2/pokemon/${id}`

            try{
                const respuesta =await fetch(API_URL)

                if(!respuesta.ok) {
                    nombre.value = ''
                    altura.value = ''
                    peso.value = ''
                    imagen.src = ''
                    alert('No existe este Pokémon')
                    throw new Error('Error de comunicación')
                }

                const datos = await respuesta.json()

                nombre.value = datos.name
                altura.value = datos.height 
                peso.value = datos.weight 
                imagen.src = datos.sprites.front_default || ''
            } catch (e) {
                console.error(e)
            }
        }
    </script>
</body>
</html>
